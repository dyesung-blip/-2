<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 워크지 공장</title>
<style>
:root{--ink:#2b2a4c;--paper:#fff;--desk:#eef1f6;--red:#ef5b4c;--yel:#ffc93c;--teal:#1fb5a8;--blue:#3d7be0;--line:#d5dbe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eceaff;--desk:#1b1d2a;--line:#3a3f55}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
header{padding:18px 16px 4px;text-align:center}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
header p{margin:4px 0 0;font-size:14px;opacity:.7}
.panel{max-width:560px;margin:12px auto;padding:0 14px}
fieldset{border:2px solid var(--line);border-radius:14px;margin:0 0 10px;padding:8px 10px 10px;background:color-mix(in srgb,var(--desk) 40%,#fff 60%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) fieldset{background:#232638}}
legend{padding:0 6px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;color:inherit;border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.hint{margin:7px 2px 0;font-size:13px;opacity:.75}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;font:inherit;font-size:17px;border:0;border-radius:14px;padding:12px;color:#fff;cursor:pointer;min-height:48px}
.new{background:var(--teal)}.print{background:var(--red)}
.btn:active{transform:scale(.98)}
select.chip{appearance:auto;padding:6px 10px}
#out{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 12px 40px}
.sheet{width:min(100%,520px);height:auto;background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(30,30,70,.18)}
@media print{
@page{size:A4;margin:0}
body{background:#fff}
header,.panel{display:none}
#out{display:block;padding:0}
.sheet{width:210mm;height:297mm;box-shadow:none;border-radius:0;break-after:page;display:block}
}
</style>
</head>
<body>
<header>
<h1>🖍️ 꼬마 워크지 공장</h1>
<p>종류·나이·테마를 고르면 인쇄할 수 있는 워크지가 바로 만들어져요</p>
</header>
<div class="panel">
<fieldset><legend>종류</legend><div class="chips" id="c-type"></div></fieldset>
<fieldset><legend>나이 (난이도)</legend><div class="chips" id="c-age"></div><p class="hint" id="hint"></p></fieldset>
<fieldset><legend>테마</legend><div class="chips" id="c-theme"></div></fieldset>
<fieldset><legend>장수</legend><select class="chip" id="pages" aria-label="장수"><option value="1">1장</option><option value="2">2장</option><option value="3">3장</option><option value="4">4장</option><option value="5">5장</option><option value="6">6장</option><option value="8">8장</option><option value="10">10장</option><option value="15">15장</option><option value="20">20장</option><option value="30">30장</option></select></fieldset>
<div class="actions"><button class="btn new" id="again">🎲 새로 만들기</button><button class="btn print" id="prt">🖨️ 인쇄하기</button></div>
</div>
<div id="out"></div>
<script>
const TYPES=[["dots","선 잇기","#3d7be0"],["maze","미로 찾기","#1fb5a8"],["match","짝 맞추기","#ef5b4c"]];
const AGES=[2,3,4,5];
const PAIRS={animals:[["🐰","🥕"],["🐶","🦴"],["🐱","🐟"],["🐻","🍯"],["🐼","🎋"],["🐷","🌽"]],dino:[["🦖","🥚"],["🦕","🌿"],["🦖","🦴"],["🐊","🐟"],["🦎","🌴"]],cars:[["🚗","🏁"],["🚒","🔥"],["🚑","🏥"],["🚜","🌾"],["🚌","🏫"],["🚓","🏠"]],fruits:[["🐛","🍎"],["🐛","🍇"],["🐝","🍑"],["🐛","🍓"],["🐒","🍌"],["🐿️","🍊"]],sea:[["🐟","🐚"],["🐙","🦀"],["🐳","🌊"],["🐬","🐠"],["🐢","🐚"]],myth:[["🦄","🏛️"],["🏹","🦉"],["🐎","🏛️"],["⚡","🔱"],["🦄","🏺"]]};
const THEMES={
animals:{n:"동물",i:"🐶",c:"#ef5b4c",p:["🐶","🐱","🐰","🐻","🐼","🦁","🐸","🐷"],s:"🐰",g:"🥕"},
dino:{n:"공룡",i:"🦖",c:"#1fb5a8",p:["🦖","🦕","🐊","🦎","🐢","🥚","🦴","🌋"],s:"🦖",g:"🥚"},
cars:{n:"자동차",i:"🚗",c:"#3d7be0",p:["🚗","🚕","🚌","🚓","🚒","🚑","🚜","🚚"],s:"🚗",g:"🏁"},
fruits:{n:"과일",i:"🍎",c:"#e8890c",p:["🍎","🍌","🍇","🍓","🍊","🍉","🍒","🍑"],s:"🐛",g:"🍎"},
sea:{n:"바다",i:"🐟",c:"#2a8fd0",p:["🐟","🐙","🐳","🦀","🐠","🐢","🦈","🐬"],s:"🐟",g:"🐚"},
myth:{n:"그리스로마신화",i:"⚡",c:"#8a5cd0",p:["⚡","🔱","🦄","🐍","🦉","🏺","🏹","🏛️"],s:"🦄",g:"🏛️"}};
const HINTS={
dots:{2:"점 8개 · 점선을 따라 그리기",3:"점 12개 · 번호 순서대로 잇기",4:"점 18개 · 번호가 조금 더 많아요",5:"점 28개 · 작은 점을 꼼꼼하게"},
maze:{2:"3×3 · 갈림길이 거의 없는 짧은 길",3:"4×4 · 쉬운 갈림길",4:"7×7 · 막다른 길이 생겨요",5:"11×11 · 복잡한 미로"},
match:{2:"3쌍 · 똑같은 그림 찾기",3:"4쌍 · 똑같은 그림 찾기",4:"5쌍 · 그림과 그림자 맞추기",5:"7쌍 · 그림과 그림자 맞추기"}};
const S={type:"dots",age:3,theme:"animals",seed:Date.now()%100000};
const EF='font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif"';
const TF='font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,sans-serif" font-weight="bold"';

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const em=(t,x,y,s,x2="")=>`<text x="${x}" y="${y+s*.35}" font-size="${s}" text-anchor="middle" ${EF} ${x2}>${t}</text>`;

function sheet(th,title,inst,body){
return`<svg class="sheet" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">
<defs><filter id="sil"><feColorMatrix values="0 0 0 0 .17 0 0 0 0 .16 0 0 0 0 .3 0 0 0 1 0"/></filter></defs>
<rect width="210" height="297" fill="#fff"/>
<rect x="6" y="6" width="198" height="285" rx="7" fill="none" stroke="${th.c}" stroke-width="1.4" stroke-dasharray="1 3" stroke-linecap="round"/>
<text x="105" y="26" font-size="15" text-anchor="middle" fill="#2b2a4c" ${TF}>${th.i} ${th.n} ${title} ${th.i}</text>
<text x="105" y="37" font-size="6.2" text-anchor="middle" fill="#666" ${TF}>${inst}</text>
<g font-size="6" fill="#2b2a4c" ${TF}><text x="15" y="50">이름</text><text x="125" y="50">날짜</text></g>
<g stroke="#999" stroke-width=".4"><line x1="27" y1="50" x2="85" y2="50"/><line x1="137" y1="50" x2="195" y2="50"/></g>
${body}
<g>${th.p.slice(0,5).map((e,i)=>em(e,55+i*25,284,8)).join("")}</g>
</svg>`}

/* ---------- 선 잇기 ---------- */
function norm(p){const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),s=Math.max(x1-x0,y1-y0);return p.map(([x,y])=>[(x-x0)/s+(1-(x1-x0)/s)/2,(y-y0)/s+(1-(y1-y0)/s)/2])}
const SHAPES=[
()=>norm(Array.from({length:120},(_,i)=>{const t=i/120*Math.PI*2;return[16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]})),
()=>norm(Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5,r=i%2?.45:1;return[Math.cos(a)*r,Math.sin(a)*r]})),
()=>norm([[.5,0],[1,.4],[.88,.4],[.88,1],[.12,1],[.12,.4],[0,.4]]),
()=>norm([[.1,.5],[.3,.3],[.55,.25],[.75,.4],[.95,.25],[.95,.75],[.75,.6],[.55,.75],[.3,.7]]),
()=>norm(Array.from({length:200},(_,i)=>{const t=i/200*Math.PI*2,r=.65+.35*Math.cos(5*t);return[Math.cos(t)*r,Math.sin(t)*r]})),
()=>norm(Array.from({length:16},(_,i)=>{const a=i*Math.PI/8,r=i%2?.7:1;return[Math.cos(a)*r,Math.sin(a)*r]})),
()=>{const a=[];for(let i=0;i<=40;i++){const t=(50.1+i*259.8/40)*Math.PI/180;a.push([Math.cos(t),Math.sin(t)])}for(let i=1;i<40;i++){const t=(280.5-i*201/40)*Math.PI/180;a.push([.5+.78*Math.cos(t),.78*Math.sin(t)])}return norm(a)},
()=>norm([[.5,.4],[.2,0],[0,.2],[.08,.5],[.25,.55],[.1,.85],[.3,.95],[.5,.65],[.7,.95],[.9,.85],[.75,.55],[.92,.5],[1,.2],[.8,0]]),
()=>norm([[.5,0],[.7,.25],[.7,.65],[.9,.9],[.65,.85],[.5,1],[.35,.85],[.1,.9],[.3,.65],[.3,.25]]),
()=>norm([[.5,0],[.8,.35],[.65,.35],[.9,.65],[.58,.65],[.58,1],[.42,1],[.42,.65],[.1,.65],[.35,.35],[.2,.35]]),
()=>norm([[0,.55],[.15,.5],[.3,.25],[.65,.25],[.8,.5],[1,.55],[1,.8],[0,.8]])];
function resample(p,n){const q=[...p,p[0]],L=[0];for(let i=1;i<q.length;i++)L.push(L[i-1]+Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));const T=L[L.length-1],o=[];let k=1;for(let i=0;i<n;i++){const d=i*T/n;while(L[k]<d)k++;const f=(d-L[k-1])/(L[k]-L[k-1]||1);o.push([q[k-1][0]+(q[k][0]-q[k-1][0])*f,q[k-1][1]+(q[k][1]-q[k-1][1])*f])}return o}
function dots(th,age,r){
const N={2:8,3:12,4:18,5:28}[age],base=SHAPES[(S.seed+(window.PI||0))%SHAPES.length]();
const P=resample(base,N).map(([x,y])=>[30+x*150,95+y*150]);
const cx=105,cy=170,fs=age>=5?4.6:age>=4?5.6:6.6,dr=age===2?4:age>=5?1.9:2.4;
let g="";
if(age===2)g+=`<polygon points="${P.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#c9ced8" stroke-width="2.4" stroke-dasharray="4 4" stroke-linejoin="round"/>`;
P.forEach(([x,y],i)=>{const a=Math.atan2(y-cy,x-cx),o=dr+fs*.8;
g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dr}" fill="${i?'#2b2a4c':'#ef5b4c'}"/>`;
g+=`<text x="${(x+Math.cos(a)*o).toFixed(1)}" y="${(y+Math.sin(a)*o+fs*.35).toFixed(1)}" font-size="${fs}" text-anchor="middle" fill="${i?'#2b2a4c':'#ef5b4c'}" ${TF}>${i+1}</text>`});
g+=`<text x="${P[0][0]}" y="${P[0][1]-dr-fs*1.6}" font-size="5" text-anchor="middle" fill="#ef5b4c" ${TF}>시작!</text>`;
return sheet(th,"선 잇기",age===2?"점선을 따라 크레파스로 그려 보세요":"1번부터 순서대로 점을 이어 보세요. 마지막엔 1번으로 돌아와요",g)}

/* ---------- 미로 찾기 ---------- */
function maze(th,age,r){
const n={2:3,3:4,4:7,5:11}[age],W=Array.from({length:n*n},()=>[1,1,1,1]),seen=new Set([0]),st=[0];
const D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
const open=(a,b,d)=>{W[a][d[2]]=0;W[b][d[3]]=0};
while(st.length){const c=st[st.length-1],x=c%n,y=(c/n)|0;
const nb=shuffle(D,r).filter(d=>{const nx=x+d[0],ny=y+d[1];return nx>=0&&ny>=0&&nx<n&&ny<n&&!seen.has(ny*n+nx)});
if(!nb.length){st.pop();continue}
const d=nb[0],m=(y+d[1])*n+x+d[0];open(c,m,[0,0,d[2],d[3]]);seen.add(m);st.push(m)}
const loops={2:2,3:2}[age]||0;
for(let k=0;k<loops;k++){const x=Math.floor(r()*(n-1)),y=Math.floor(r()*n);if(r()<.5)open(y*n+x,y*n+x+1,[0,0,1,3]);else{const yy=Math.min(y,n-2);open(yy*n+x,(yy+1)*n+x,[0,0,2,0])}}
W[0][0]=0;W[n*n-1][2]=0;
const M=170,X=20,Y=68,cs=M/n,sw=age===2?2.6:age===3?2.2:age===4?1.5:1;
let l="";
for(let i=0;i<n*n;i++){const x=X+(i%n)*cs,y=Y+((i/n)|0)*cs,w=W[i];
if(w[0])l+=`M${x} ${y}h${cs}`;if(w[3])l+=`M${x} ${y}v${cs}`;
if(i%n===n-1&&w[1])l+=`M${x+cs} ${y}v${cs}`;if(i>=n*(n-1)&&w[2])l+=`M${x} ${y+cs}h${cs}`}
const es=Math.min(cs*.7,16);
let g=`<path d="${l}" stroke="#2b2a4c" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
g+=em(th.s,X+cs/2-(n===3?0:0),Y-8,16)+em(th.g,X+M-cs/2,Y+M+13,16);
return sheet(th,"미로 찾기",`${th.s}가 ${th.g}에게 가는 길을 연필로 그려 보세요`,g)}

/* ---------- 짝 맞추기 ---------- */
function match(th,age,r){
const n={2:3,3:4,4:5,5:7}[age],items=shuffle(th.p,r).slice(0,n),right=shuffle(items,r);
const top=66,H=200,gap=H/n,fs=Math.min(gap*.72,28),shadow=age>=4;let g="";
items.forEach((e,i)=>{const y=top+gap*(i+.5);
g+=em(e,40,y,fs)+`<circle cx="72" cy="${y}" r="2.6" fill="#2b2a4c"/>`});
right.forEach((e,i)=>{const y=top+gap*(i+.5);
g+=`<circle cx="138" cy="${y}" r="2.6" fill="#2b2a4c"/>`+em(e,170,y,fs,shadow?'filter="url(#sil)"':'')});
return sheet(th,"짝 맞추기",shadow?"그림과 똑같은 그림자를 줄로 이어 보세요":"똑같은 그림끼리 줄로 이어 보세요",g)}

const GEN={dots,maze,match};
function render(){
const th=THEMES[S.theme],n=+document.getElementById("pages").value;let h="";
for(let i=0;i<n;i++){const q=rng(S.seed*31+i*104729),pr=PAIRS[S.theme],pa=pr[Math.floor(q()*pr.length)],pl=shuffle(th.p,q);window.PI=i;h+=GEN[S.type]({...th,i:pl[0],p:pl,s:pa[0],g:pa[1]},S.age,rng(S.seed+i*7919))}
document.getElementById("out").innerHTML=h;
document.getElementById("hint").textContent=HINTS[S.type][S.age];drawThemes()}
function chips(id,list,key,label,color){
const box=document.getElementById(id);
box.innerHTML=list.map(v=>{const val=Array.isArray(v)?v[0]:v;return`<button class="chip" data-v="${val}" style="--c:${color(v)}" aria-pressed="${S[key]==val}">${label(v)}</button>`}).join("");
box.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S[key]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;S.seed=Math.floor(Math.random()*1e5);
box.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()}}
chips("c-type",TYPES,"type",v=>v[1],v=>v[2]);
chips("c-age",AGES,"age",v=>"만 "+v+"세",()=>"#e8890c");
function drawThemes(){chips("c-theme",Object.keys(THEMES),"theme",k=>{const p=THEMES[k].p;return p[Math.floor(rng(S.seed+k.charCodeAt(0)*7)()*p.length)]+" "+THEMES[k].n},k=>THEMES[k].c)}
document.getElementById("pages").onchange=render;
document.getElementById("again").onclick=()=>{S.seed=Math.floor(Math.random()*1e5);render()};
document.getElementById("prt").onclick=()=>window.print();
render();
</script>
</body>
</html>
